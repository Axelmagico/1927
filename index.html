<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon Arquitectura | Casa 1927</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0c0c0c;
            --gold: #c5a059;
            --white: #ffffff;
            --light-grey: #f4f4f4;
            --placeholder-img: #cccccc;
            --placeholder-vid: #add8e6;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            --header-h: 200px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--white); color: var(--primary); overflow-x: hidden; }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: var(--white); display: flex;
            justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; border-bottom: 1px solid #eee;
        }
        
        .logo-container {
            height: 100%;
            display: flex;
            align-items: center;
            max-width: 400px;
        }
        
        .logo-img {
            width: 100%;
            height: auto;
            max-height: 150px;
            object-fit: contain;
        }

        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--primary); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* --- RECUADRO DE WHATSAPP CON BORDE DORADO --- */
        .header-contact {
            display: flex;
            align-items: center;
            justify-content: center;
            /* Borde Dorado Solicitado */
            border: 2px solid var(--gold);
            padding: 12px 25px;
            transition: all 0.4s ease-in-out;
            cursor: pointer;
        }

        .whatsapp-link {
            text-decoration: none;
            color: var(--gold);
            /* Tamaño de texto aumentado */
            font-size: 1.2rem; 
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px; /* Espacio proporcional entre icono y texto */
        }

        .whatsapp-link i {
            /* Tamaño de icono aumentado proporcionalmente */
            font-size: 1.8rem; 
        }

        /* Efecto Overclick / Hover al estilo Aqua */
        .header-contact:hover {
            background-color: var(--gold);
            transform: scale(1.05);
        }

        .header-contact:hover .whatsapp-link {
            color: var(--white); /* El texto cambia a blanco al pasar el mouse */
        }

        /* --- HERO --- */
        .hero { height: 85vh; margin-top: var(--header-h); position: relative; }
        .hero-info {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; z-index: 5;
        }
        .hero-info h1 { font-family: var(--font-title); font-size: 4rem; color: var(--white); margin-bottom: 20px; }

        /* --- UTILIDADES --- */
        .foto-placeholder { background: var(--placeholder-img); min-height: 300px; display: flex; justify-content: center; align-items: center; color: #666; font-weight: bold; }
        .video-placeholder { background: var(--placeholder-vid); min-height: 450px; display: flex; justify-content: center; align-items: center; color: #446688; font-weight: bold; }

        section { padding: 80px 10%; }
        .flex-container { display: flex; align-items: center; gap: 50px; margin-bottom: 60px; }
        h2 { font-family: var(--font-title); font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .whatsapp-link { font-size: 1rem; }
            .whatsapp-link i { font-size: 1.5rem; }
            .header-contact { padding: 8px 15px; }
        }

        @media (max-width: 900px) {
            :root { --header-h: 220px; }
            header { flex-direction: column; justify-content: space-evenly; padding: 20px 0; }
            .logo-img { max-height: 80px; }
            nav { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Casa 1927" class="logo-img">
        </div>
        
        <nav>
            <ul>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
            </ul>
        </nav>

        <div class="header-contact">
            <a href="https://wa.me/595974812265" target="_blank" class="whatsapp-link">
                <i class="fab fa-whatsapp"></i> +595 974812265
            </a>
        </div>
    </header>

    <div class="hero">
        <div class="video-placeholder">AQUÍ VA UN VIDEO</div>
        <div class="hero-info">
            <h1>blablabla</h1>
            <p style="color: white;">blablabla blablabla blablabla</p>
        </div>
    </div>

    <section>
        <div class="flex-container">
            <div class="text-block">
                <h2>blablabla</h2>
                <p>blablabla blablabla blablabla blablabla blablabla blablabla blablabla blablabla.</p>
            </div>
            <div class="media-block">
                <div class="foto-placeholder">AQUÍ VA UNA FOTO</div>
            </div>
        </div>
    </section>

</body>
</html>
