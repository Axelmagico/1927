<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon Arquitectura | Casa 1927</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0c0c0c;
            --gold: #c5a059;
            --white: #ffffff;
            --light-grey: #f4f4f4;
            --placeholder-img: #cccccc;
            --placeholder-vid: #add8e6;
            --font-title: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            --header-h: 200px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--white); color: var(--primary); overflow-x: hidden; }

        /* --- HEADER --- */
        header {
            position: fixed; top: 0; width: 100%; height: var(--header-h);
            background: var(--white); display: flex;
            justify-content: space-between; align-items: center;
            padding: 0 5%; z-index: 1000; border-bottom: 1px solid #eee;
        }
        
        .logo-container {
            height: 100%; display: flex; align-items: center; max-width: 400px;
        }
        
        .logo-img {
            width: 100%; height: auto; max-height: 150px; object-fit: contain;
        }

        /* --- NAVEGACIÓN DESKTOP --- */
        nav.nav-desktop ul { display: flex; list-style: none; gap: 25px; }
        nav.nav-desktop a { text-decoration: none; color: var(--primary); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        nav.nav-desktop a:hover { color: var(--gold); }

        /* --- BOTÓN WHATSAPP DORADO --- */
        .header-contact {
            border: 2px solid var(--gold); padding: 12px 25px; transition: all 0.4s ease; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 15px;
        }
        .whatsapp-link { text-decoration: none; color: var(--gold); font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .whatsapp-link i { font-size: 1.8rem; }

        .header-contact:hover { background: var(--gold); }
        .header-contact:hover .whatsapp-link { color: var(--white); }

        /* --- HAMBURGUESA MÓVIL --- */
        .hamburger {
            display: none; flex-direction: column; gap: 6px; cursor: pointer; z-index: 1001;
        }
        .hamburger span { width: 30px; height: 3px; background: var(--primary); transition: 0.3s; }

        /* --- MENÚ OVERLAY MÓVIL --- */
        .mobile-menu {
            position: fixed; top: 0; right: -100%; width: 80%; height: 100vh;
            background: var(--white); z-index: 999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; transition: 0.5s; box-shadow: -5px 0 15px rgba(0,0,0,0.1);
        }
        .mobile-menu.active { right: 0; }
        .mobile-menu ul { list-style: none; text-align: center; }
        .mobile-menu li { margin: 25px 0; }
        .mobile-menu a { font-family: var(--font-title); font-size: 1.8rem; text-decoration: none; color: var(--primary); text-transform: uppercase; }

        /* --- HERO --- */
        .hero { height: 80vh; margin-top: var(--header-h); position: relative; }
        .hero-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5; }
        .hero-info h1 { font-family: var(--font-title); font-size: 4rem; color: var(--white); }

        /* --- PLACEHOLDERS --- */
        .video-placeholder { background: var(--placeholder-vid); height: 100%; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .foto-placeholder { background: var(--placeholder-img); min-height: 400px; display: flex; justify-content: center; align-items: center; font-weight: bold; }

        section { padding: 80px 10%; }
        .flex-container { display: flex; align-items: center; gap: 50px; }
        h2 { font-family: var(--font-title); font-size: 2.5rem; color: var(--gold); margin-bottom: 20px; }

        /* --- RESPONSIVE MÓVIL (CORRECCIÓN) --- */
        @media (max-width: 1024px) {
            nav.nav-desktop { display: none; }
            .hamburger { display: flex; }
            
            :root { --header-h: 140px; }
            .logo-img { max-height: 80px; }
            
            .header-contact { padding: 8px 15px; }
            .whatsapp-link { font-size: 0.9rem; }
            .whatsapp-link i { font-size: 1.3rem; }
        }

        @media (max-width: 600px) {
            header { padding: 0 15px; }
            .header-contact { border-width: 1px; }
            .whatsapp-link span { display: none; } /* Oculta el número en pantallas muy pequeñas, deja el icono */
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.png" alt="Casa 1927" class="logo-img">
        </div>
        
        <nav class="nav-desktop">
            <ul>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
                <li><a href="#">blablabla</a></li>
            </ul>
        </nav>

        <a href="https://wa.me/595974812265" target="_blank" class="header-contact">
            <div class="whatsapp-link">
                <i class="fab fa-whatsapp"></i>
                <span>+595 974812265</span>
            </div>
        </a>

        <div class="hamburger" id="hamburguer-btn">
            <span></span><span></span><span></span>
        </div>
    </header>

    <div class="mobile-menu" id="mobile-nav">
        <ul>
            <li><a href="#">blablabla</a></li>
            <li><a href="#">blablabla</a></li>
            <li><a href="#">blablabla</a></li>
            <li><a href="#">blablabla</a></li>
        </ul>
    </div>

    <div class="hero">
        <div class="video-placeholder">AQUÍ VA UN VIDEO</div>
        <div class="hero-info">
            <h1>blablabla</h1>
        </div>
    </div>

    <section>
        <div class="flex-container">
            <div style="flex:1;">
                <h2>blablabla</h2>
                <p>blablabla blablabla blablabla blablabla blablabla blablabla blablabla blablabla.</p>
            </div>
            <div style="flex:1;">
                <div class="foto-placeholder">AQUÍ VA UNA FOTO</div>
            </div>
        </div>
    </section>

    <script>
        // Lógica para el menú móvil
        const hamburger = document.getElementById('hamburguer-btn');
        const mobileMenu = document.getElementById('mobile-nav');

        hamburger.addEventListener('click', () => {
            mobileMenu.classList.toggle('active');
            
            // Animación simple de la hamburguesa
            const spans = hamburger.querySelectorAll('span');
            spans[0].style.transform = mobileMenu.classList.contains('active') ? 'rotate(45deg) translate(5px, 6px)' : 'none';
            spans[1].style.opacity = mobileMenu.classList.contains('active') ? '0' : '1';
            spans[2].style.transform = mobileMenu.classList.contains('active') ? 'rotate(-45deg) translate(7px, -8px)' : 'none';
        });

        // Cerrar menú al clickear un enlace
        document.querySelectorAll('.mobile-menu a').forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
