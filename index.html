<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASA 1927 | Eventos Memorables</title>
    <style>
        :root {
            --primary: #111111;
            --secondary: #222222;
            --gold: #c5a059;
            --text-light: #f4f4f4;
            --text-muted: #aaaaaa;
            --font-main: 'Helvetica Neue', Arial, sans-serif;
            --font-title: 'Georgia', serif;
            /* Altura base para PC */
            --header-height: 180px; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-main);
            background-color: var(--primary);
            color: var(--text-light);
            line-height: 1.6;
            padding-top: var(--header-height);
        }

        /* --- HEADER Y NAVEGACIÓN --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--header-height);
            padding: 0 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 17, 17, 0.98);
            z-index: 1000;
            border-bottom: 1px solid #333;
            transition: all 0.3s ease;
        }

        .logo-link {
            display: flex;
            align-items: center;
            height: 100%;
            text-decoration: none;
        }

        .logo-img {
            /* TAMAÑO PARA PC: 450px */
            width: 450px; 
            height: auto; 
            max-height: 150px;
            display: block;
            object-fit: contain;
            transition: width 0.3s ease;
        }

        /* Menú de Navegación */
        nav ul {
            display: flex;
            list-style: none;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 30px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
            font-weight: 600;
        }

        nav a:hover { color: var(--gold); }

        /* Icono Hamburguesa (Oculto en PC) */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
        }

        .menu-toggle span {
            width: 30px;
            height: 3px;
            background-color: var(--gold);
            transition: 0.3s;
        }

        /* --- SECCIÓN HERO --- */
        .hero {
            position: relative;
            height: calc(100vh - var(--header-height));
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            overflow: hidden;
        }

        .video-bg {
            position: absolute;
            top: 50%; left: 50%;
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            z-index: -2;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .hero-content h1 {
            font-family: var(--font-title);
            font-size: 4rem;
            margin-bottom: 10px;
            color: var(--gold);
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* --- SECCIONES CONTENIDO --- */
        section { padding: 80px 10%; }
        .section-title {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 40px;
            text-align: center;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stat-card {
            background: var(--secondary);
            padding: 30px;
            text-align: center;
            border-top: 3px solid var(--gold);
        }

        /* --- RESPONSIVE (MÓVIL) --- */
        @media (max-width: 992px) {
            :root { --header-height: 110px; }
            .logo-img { width: 280px; }
            nav a { margin-left: 20px; font-size: 0.8rem; }
        }

        @media (max-width: 768px) {
            :root { --header-height: 100px; }
            .logo-img { width: 220px; }

            .menu-toggle { display: flex; z-index: 1100; }

            /* Menú móvil desplegable */
            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background: var(--primary);
                display: flex;
                justify-content: center;
                align-items: center;
                transition: 0.5s;
                border-left: 1px solid var(--gold);
            }

            nav.active { right: 0; }

            nav ul {
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }

            nav a { margin-left: 0; font-size: 1.2rem; }

            .hero h1 { font-size: 2.5rem; }
            .grid-2, .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-link">
            <img src="logo.png" alt="CASA 1927" class="logo-img">
        </a>

        <div class="menu-toggle" id="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="nav-menu">
            <ul>
                <li><a href="#historia">El Lugar</a></li>
                <li><a href="#espacios">Espacios</a></li>
                <li><a href="#servicios">Servicios</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <video class="video-bg" autoplay loop muted playsinline preload="auto">
            <source src="videopromo.mp4" type="video/mp4">
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Eventos Memorables</h1>
            <p>Donde el anfitrión sos VOS.</p>
        </div>
    </section>

    <section id="historia">
        <h2 class="section-title">Historia y Arte</h2>
        <div class="grid-2">
            <p>Un espacio donde la arquitectura de 1927 se fusiona con murales de Josefina Plá, creando un escenario único en el corazón de Asunción.</p>
            <div class="stats-grid">
                <div class="stat-card"><h3>7000m²</h3><p>Propiedad</p></div>
                <div class="stat-card"><h3>400m²</h3><p>Salón Principal</p></div>
            </div>
        </div>
    </section>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');

        mobileMenu.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            // Animación del icono
            mobileMenu.classList.toggle('is-active');
        });

        // Cerrar menú al hacer clic en un enlace
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                navMenu.classList.remove('active');
            });
        });
    </script>

</body>
</html>
